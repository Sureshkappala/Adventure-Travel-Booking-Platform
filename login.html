<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Secure portal access for Adventures explorers and guides. Log in to manage bookings and routes.">
    <title>Login | Adventures Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .back-to-home-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 10;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.3rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            background: #1e293b !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            transition: all var(--transition-fast);
            text-decoration: none;
            cursor: pointer;
        }
        .back-to-home-btn:hover {
            border-color: #8b5cf6 !important;
            color: #8b5cf6 !important;
            background: rgba(139, 92, 246, 0.1) !important;
        }
        @media (max-width: 768px) {
            .back-to-home-btn {
                position: relative !important;
                top: 0 !important;
                left: 0 !important;
                margin: 0 auto 1.5rem auto !important;
                display: inline-flex !important;
                text-align: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body style="background-color: var(--color-primary); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 2rem 1rem;">



    <!-- BACK TO HOME BUTTON -->
    <a href="index.html" class="back-to-home-btn"><i class="fa-solid fa-house"></i> Back to Home</a>

    <!-- LOGIN CONTAINER -->
    <div class="container" style="max-width: 440px; padding: 0; width: 100%;">
        <div class="glass-card" style="padding: 2.75rem 2.25rem; text-align: center; border: 1px solid rgba(139, 92, 246, 0.25); box-shadow: 0 15px 35px rgba(0,0,0,0.4);">
            
            <!-- LOGO & HEADING -->
            <div style="text-align: center; margin-bottom: 2rem;">
                <img src="images/logo.webp" alt="Logo" class="logo-img" style="height: 38px; margin: 0 auto 1.25rem auto; display: block; filter: brightness(0) invert(1);">
                <h2 style="font-size: 2rem; margin-bottom: 0.4rem; color: var(--color-text-white); font-family: var(--font-heading); font-weight: 700; text-align: center;">Welcome Back</h2>
                <p style="font-size: 0.88rem; color: var(--color-text-muted); text-align: center; margin-bottom: 2rem;">Access your client portal or design dashboard.</p>
            </div>

            <!-- FORM -->
            <form id="login-form" style="text-align: left;">
                
                <!-- EMAIL FIELD WITH ICON -->
                <div class="form-group">
                    <label for="login-email" style="display: block; margin-bottom: 0.5rem; font-size: 0.85rem; font-weight: 600; color: var(--color-text-white);">Email Address</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); font-size: 0.9rem;"></i>
                        <input type="email" id="login-email" placeholder="john@example.com" class="form-control" style="padding-left: 2.75rem; background: #070d1e !important; border: 1px solid var(--color-border-glass); color: #fff;" required>
                    </div>
                </div>

                <!-- PASSWORD FIELD WITH LOCK & EYE ICON -->
                <div class="form-group">
                    <label for="login-password" style="display: block; margin-bottom: 0.5rem; font-size: 0.85rem; font-weight: 600; color: var(--color-text-white);">Password</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); font-size: 0.9rem;"></i>
                        <input type="password" id="login-password" placeholder="••••••••" class="form-control" style="padding-left: 2.75rem; padding-right: 2.75rem; background: #070d1e !important; border: 1px solid var(--color-border-glass); color: #fff;" required>
                        <button type="button" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--color-text-muted); cursor: pointer;" onclick="togglePassword()">
                            <i class="fa-solid fa-eye" id="pwd-eye-icon"></i>
                        </button>
                    </div>
                </div>

                <!-- ROLE SELECT FIELD WITH USER ICON -->
                <div class="form-group">
                    <label for="login-role" style="display: block; margin-bottom: 0.5rem; font-size: 0.85rem; font-weight: 600; color: var(--color-text-white);">Select Role</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); font-size: 0.9rem;"></i>
                        <select id="login-role" class="form-control" style="padding-left: 2.75rem; background: #070d1e !important; border: 1px solid var(--color-border-glass); color: #fff;" required>
                            <option value="" disabled selected>Select Role</option>
                            <option value="client">Private Explorer / Climber</option>
                            <option value="advisor">Expedition Guide / Admin</option>
                        </select>
                    </div>
                </div>

                <!-- REMEMBER ME & FORGOT PASSWORD ROW -->
                <div class="login-remember-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.75rem; font-size: 0.85rem; width: 100%;">
                    <label class="remember-label" style="display: flex; align-items: center; gap: 0.4rem; color: var(--color-text-muted); cursor: pointer;">
                        <input type="checkbox" style="width: auto; margin: 0;"> Remember Me
                    </label>
                    <a href="404.html" class="forgot-link" style="color: #b58a63; font-weight: 600; text-decoration: none;">Forgot Password?</a>
                </div>

                <!-- SUBMIT BUTTON -->
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem; font-size: 1.05rem; font-weight: 700; border-radius: var(--border-radius-sm); border: none; background: #b58a63 !important; color: #000000 !important; text-shadow: none;">Access Portal</button>

            </form>

            <!-- BOTTOM REGISTER LINK -->
            <div style="text-align: center; margin-top: 1.75rem; font-size: 0.85rem; color: var(--color-text-muted);">
                Don't have a design account? <a href="register.html" style="color: #10b981; font-weight: 700; text-decoration: none;">Register Here</a>
            </div>

        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        function togglePassword() {
            const field = document.getElementById('login-password');
            const icon = document.getElementById('pwd-eye-icon');
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const role = document.getElementById('login-role').value || 'client';

            // Password complexity check
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{8,}$/;
            if (!passwordRegex.test(password)) {
                window.showCustomAlert('Password must be at least 8 characters long and contain a combination of uppercase, lowercase, digits, and symbols.', 'error');
                return;
            }

            localStorage.setItem('loggedInUserName', email.split('@')[0].toUpperCase());
            localStorage.setItem('loggedInUserRole', role);
            window.showCustomAlert('Credentials Authorized! Redirecting to Expedition Control...', 'success');
            setTimeout(() => {
                window.location.href = 'studio-portal.html';
            }, 1800);
        });
    </script>
</body>
</html>
