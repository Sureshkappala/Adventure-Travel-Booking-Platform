<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="404 Page Not Found - Adventures.">
    <title>Page Lost in Transmissions (404) | Adventures</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Ambient Background Glows */
        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(80px);
            opacity: 0.55;
        }
        
        .btn-home {
            background: var(--color-accent-orange) !important;
            color: #000 !important;
            font-weight: 700;
            padding: 0.85rem 1.8rem;
            border-radius: 99px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.4);
        }

        .btn-back {
            background: rgba(30, 41, 59, 0.55) !important;
            color: #fff !important;
            font-weight: 600;
            padding: 0.85rem 1.8rem;
            border-radius: 99px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            background: rgba(30, 41, 59, 0.8) !important;
        }
    </style>
</head>
<body style="background-color: var(--color-bg-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 2rem 1rem; box-sizing: border-box;">

    <!-- Background Blobs -->
    <div class="ambient-blob" style="background: radial-gradient(circle, rgba(249, 115, 22, 0.1) 0%, rgba(10, 17, 40, 0) 70%); width: 500px; height: 500px; top: 10%; left: 10%;"></div>
    <div class="ambient-blob" style="background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, rgba(10, 17, 40, 0) 70%); width: 600px; height: 600px; bottom: 10%; right: 10%;"></div>

    <!-- 404 CONTENT CONTAINER -->
    <div class="container" style="max-width: 520px; position: relative; z-index: 2;">
        <div class="glass-card" style="padding: 4rem 2.5rem; text-align: center; border: 1px solid rgba(139, 92, 246, 0.2); background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: var(--border-radius-md); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);">
            
            <!-- 404 TEXT -->
            <div style="position: relative; display: inline-block; margin-bottom: 1.5rem;">
                <h1 style="font-size: 7rem; font-weight: 900; line-height: 1; margin: 0; color: var(--color-accent-orange); letter-spacing: -0.02em; font-family: var(--font-heading); text-shadow: 4px 4px 0px rgba(10, 17, 40, 0.8);">404</h1>
            </div>

            <!-- TAG -->
            <div style="margin-bottom: 1.5rem;">
                <span class="section-tag" style="background: rgba(255, 122, 0, 0.1); border-color: rgba(255, 122, 0, 0.25); color: var(--color-accent-orange); display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.4rem 1.2rem; border-radius: 99px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">
                    <i class="fa-solid fa-triangle-exclamation"></i> ERROR 404
                </span>
            </div>

            <!-- TITLE & DESCRIPTION -->
            <h2 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 1.25rem; color: var(--color-text-white); font-family: var(--font-heading); line-height: 1.2;">Page Lost in Transmissions</h2>
            <p style="color: var(--color-text-muted); font-size: 0.95rem; line-height: 1.65; margin-bottom: 2.5rem; max-width: 440px; margin-left: auto; margin-right: auto;">
                We can't seem to find the page you're looking for. The link may be broken, or the page has been moved. Let's get you back on track.
            </p>

            <!-- ACTION BUTTONS -->
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i> Back to Home</a>
                <button onclick="window.history.back()" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Go Back</button>
            </div>

        </div>
    </div>

</body>
</html>
