<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="404 Page Not Found - Adventures.">
    <title>Expedition Lost in Transmissions (404) | Adventures</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Ambient Background Glows */
        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(80px);
            opacity: 0.65;
        }
        
        /* Star/Dust Particle container */
        #flare-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }
        
        .flare-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: radial-gradient(circle, #f97316 0%, rgba(249, 115, 22, 0) 70%);
            box-shadow: 0 0 8px #f97316;
            animation: float-dust 3s ease-out forwards;
        }

        /* Compass HUD styling */
        .compass-hud {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px dashed rgba(249, 115, 22, 0.35);
            background: rgba(10, 17, 40, 0.45);
            position: relative;
            margin: 2rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.05);
            transition: border-color 0.3s ease;
        }

        .compass-hud::before {
            content: '';
            position: absolute;
            width: 146px;
            height: 146px;
            border-radius: 50%;
            border: 1px solid rgba(16, 185, 129, 0.15);
            animation: spin-slow 20s linear infinite;
        }

        .compass-hud::after {
            content: 'N';
            position: absolute;
            top: 6px;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--color-accent-orange);
            font-family: var(--font-heading);
        }

        .compass-label-s { position: absolute; bottom: 6px; font-size: 0.7rem; font-weight: 700; color: var(--color-text-muted); }
        .compass-label-e { position: absolute; right: 8px; font-size: 0.7rem; font-weight: 700; color: var(--color-text-muted); }
        .compass-label-w { position: absolute; left: 8px; font-size: 0.7rem; font-weight: 700; color: var(--color-text-muted); }

        .compass-needle {
            width: 8px;
            height: 70px;
            position: relative;
            transform-origin: center center;
            transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .compass-needle::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 35px solid var(--color-accent-orange);
        }

        .compass-needle::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 35px solid rgba(148, 163, 184, 0.5);
        }

        /* Glitch text keyframes */
        .glitch-text {
            animation: glitch 1.5s steps(2) infinite alternate;
            position: relative;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-bg-dark);
        }

        .glitch-text::before {
            left: 2px;
            text-shadow: -2px 0 #10b981;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -2px;
            text-shadow: -2px 0 #f97316;
            clip: rect(85px, 450px, 140px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch {
            0% { transform: skew(0deg); }
            20% { transform: skew(-1deg); }
            40% { transform: skew(1deg); }
            60% { transform: skew(-0.5deg); }
            80% { transform: skew(0.5deg); }
            100% { transform: skew(0deg); }
        }

        @keyframes glitch-anim {
            0% { clip: rect(15px, 9999px, 66px, 0); }
            100% { clip: rect(34px, 9999px, 55px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(70px, 9999px, 105px, 0); }
            100% { clip: rect(12px, 9999px, 85px, 0); }
        }

        @keyframes float-dust {
            0% {
                transform: translateY(0) translateX(0) scale(0.6);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-250px) translateX(var(--drift, 20px)) scale(0.1);
                opacity: 0;
            }
        }
    </style>
</head>
<body style="background-color: var(--color-bg-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 2rem 1rem; box-sizing: border-box;">

    <!-- Background Blobs -->
    <div class="ambient-blob" style="background: radial-gradient(circle, rgba(249, 115, 22, 0.15) 0%, rgba(10, 17, 40, 0) 70%); width: 500px; height: 500px; top: -10%; left: -10%;"></div>
    <div class="ambient-blob" style="background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(10, 17, 40, 0) 70%); width: 600px; height: 600px; bottom: -20%; right: -10%;"></div>

    <!-- Star/Dust particles layer -->
    <div id="flare-container"></div>

    <!-- 404 CONTENT CONTAINER -->
    <div class="container" style="max-width: 520px; position: relative; z-index: 2;">
        <div class="glass-card" style="padding: 3rem 2rem; text-align: center; border-color: rgba(255, 122, 0, 0.25); background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: var(--border-radius-md); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);">
            
            <!-- CHROMATIC ABERRATION 404 TEXT -->
            <div style="position: relative; display: inline-block; margin-bottom: 0.5rem;">
                <h1 class="glitch-text" style="font-size: 7.5rem; font-weight: 900; line-height: 1; margin: 0; color: var(--color-accent-orange); letter-spacing: -0.04em; font-family: var(--font-heading);">404</h1>
            </div>

            <!-- TAG -->
            <div style="margin-bottom: 1.25rem;">
                <span class="section-tag" style="background: rgba(255, 122, 0, 0.1); border-color: rgba(255, 122, 0, 0.25); color: var(--color-accent-orange); display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.4rem 1.2rem; border-radius: 99px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase;">
                    <i class="fa-solid fa-triangle-exclamation"></i> TELEMETRY LOST
                </span>
            </div>

            <!-- COMPASS HUD CONTAINER -->
            <div class="compass-hud" id="compassHud">
                <span class="compass-label-s">S</span>
                <span class="compass-label-e">E</span>
                <span class="compass-label-w">W</span>
                <div class="compass-needle" id="compassNeedle"></div>
            </div>

            <!-- STATUS INFO -->
            <div style="background: rgba(7, 13, 30, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); padding: 0.75rem; border-radius: var(--border-radius-sm); margin-bottom: 2rem; font-family: monospace; font-size: 0.78rem; color: #10b981; letter-spacing: 1px; display: inline-block; max-width: 100%; box-sizing: border-box;">
                SIGNAL FAILURE | <span id="coordinatesReadout">LAT: 40.0150 N | LON: 105.2705 W</span>
            </div>

            <!-- TITLE & DESCRIPTION -->
            <h2 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 1rem; color: var(--color-text-white); font-family: var(--font-heading); line-height: 1.2;">Expedition Lost in Transmission</h2>
            <p style="color: var(--color-text-muted); font-size: 0.92rem; line-height: 1.6; margin-bottom: 2.25rem; max-width: 420px; margin-left: auto; margin-right: auto;">
                We can't establish a link to the requested sector coordinates. Tap below to launch a signal flare, or re-route back to Base Camp.
            </p>

            <!-- ACTION BUTTONS -->
            <div style="display: flex; flex-direction: column; gap: 1rem; align-items: stretch;">
                <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                    <a href="index.html" class="btn btn-primary" style="padding: 0.85rem 1.6rem; font-weight: 700; border-radius: var(--border-radius-sm);"><i class="fa-solid fa-house"></i> Base Camp (Home)</a>
                    <button onclick="window.history.back()" class="btn btn-secondary" style="padding: 0.85rem 1.6rem; cursor: pointer; font-weight: 700; border-radius: var(--border-radius-sm); border: 1px solid var(--color-border-glass);"><i class="fa-solid fa-arrow-left"></i> Turn Back</button>
                </div>
                <button id="btnLaunchFlare" class="btn" style="background: rgba(249, 115, 22, 0.15) !important; border: 1px solid var(--color-accent-orange) !important; color: var(--color-accent-orange) !important; font-weight: 700; padding: 0.85rem; border-radius: var(--border-radius-sm); cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    <i class="fa-solid fa-fire-flame-curved"></i> Launch Signal Flare
                </button>
            </div>

        </div>
    </div>

    <script>
        // Interactive Compass Pointer tracking mouse
        const compassNeedle = document.getElementById('compassNeedle');
        const compassHud = document.getElementById('compassHud');

        document.addEventListener('mousemove', (e) => {
            const rect = compassHud.getBoundingClientRect();
            // Get center point of compass HUD
            const compassCenterX = rect.left + rect.width / 2;
            const compassCenterY = rect.top + rect.height / 2;
            
            // Calculate angle between mouse cursor and compass center
            const angleRad = Math.atan2(e.clientY - compassCenterY, e.clientX - compassCenterX);
            const angleDeg = (angleRad * 180) / Math.PI + 90; // Add 90 to align arrow correctly
            
            compassNeedle.style.transform = `rotate(${angleDeg}deg)`;
        });

        // Simulating Telemetry Coordinate Scans
        const coordinatesReadout = document.getElementById('coordinatesReadout');
        setInterval(() => {
            const randomLat = (40.0150 + (Math.random() - 0.5) * 0.05).toFixed(4);
            const randomLon = (105.2705 + (Math.random() - 0.5) * 0.05).toFixed(4);
            coordinatesReadout.textContent = `LAT: ${randomLat} N | LON: ${randomLon} W`;
        }, 1200);

        // Signal Flare Particle Spawning Engine
        const btnLaunchFlare = document.getElementById('btnLaunchFlare');
        const flareContainer = document.getElementById('flare-container');

        btnLaunchFlare.addEventListener('click', () => {
            // Spawn 15 particles rising up
            for (let i = 0; i < 15; i++) {
                createFlareParticle();
            }
            
            // Subtle button click visual feedback
            btnLaunchFlare.style.transform = 'scale(0.96)';
            setTimeout(() => {
                btnLaunchFlare.style.transform = 'scale(1)';
            }, 100);
        });

        function createFlareParticle() {
            const particle = document.createElement('div');
            particle.classList.add('flare-particle');
            
            // Position near the button click
            const rect = btnLaunchFlare.getBoundingClientRect();
            const startX = rect.left + rect.width / 2 + (Math.random() - 0.5) * 80;
            const startY = rect.top + (Math.random() - 0.5) * 20;
            
            particle.style.left = `${startX}px`;
            particle.style.top = `${startY}px`;
            
            // Random sizes & delay & vertical velocity
            const size = Math.floor(Math.random() * 8) + 4;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            // Drift calculation for keyframe
            const driftVal = Math.floor((Math.random() - 0.5) * 120);
            particle.style.setProperty('--drift', `${driftVal}px`);
            
            // Random delay and duration
            const delay = Math.random() * 0.2;
            const duration = 1.5 + Math.random() * 1.5;
            particle.style.animationDelay = `${delay}s`;
            particle.style.animationDuration = `${duration}s`;
            
            // Set random glowing colors from orange to red
            const colorOption = Math.random();
            if (colorOption < 0.3) {
                particle.style.background = 'radial-gradient(circle, #f97316 0%, rgba(249, 115, 22, 0) 70%)';
                particle.style.boxShadow = '0 0 10px #f97316';
            } else if (colorOption < 0.6) {
                particle.style.background = 'radial-gradient(circle, #ef4444 0%, rgba(239, 68, 68, 0) 70%)';
                particle.style.boxShadow = '0 0 10px #ef4444';
            } else {
                particle.style.background = 'radial-gradient(circle, #eab308 0%, rgba(234, 179, 8, 0) 70%)';
                particle.style.boxShadow = '0 0 10px #eab308';
            }

            flareContainer.appendChild(particle);
            
            // Remove after animation finishes
            setTimeout(() => {
                particle.remove();
            }, (duration + delay) * 1000);
        }
    </script>
</body>
</html>
