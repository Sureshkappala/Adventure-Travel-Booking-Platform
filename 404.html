<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="404 Page Not Found - Adventures.">
    <title>Expedition Lost in Transmissions (404) | Adventures</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background-color: var(--color-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative;">



    <!-- 404 ERROR CARD CONTAINER -->
    <div class="container" style="max-width: 520px; padding: 2rem 1rem;">
        <div class="glass-card" style="padding: 3.5rem 2.5rem; text-align: center; border-color: rgba(255, 122, 0, 0.25);">
            
            <!-- GIANT 404 NUMBER WITH TEXT EFFECT -->
            <div style="position: relative; display: inline-block; margin-bottom: 1.5rem;">
                <h1 style="font-size: 7rem; font-weight: 900; line-height: 1; margin: 0; color: var(--color-accent-orange); text-shadow: 4px 4px 0px rgba(16, 185, 129, 0.2); letter-spacing: -0.04em; font-family: var(--font-heading);">404</h1>
            </div>

            <!-- BADGE -->
            <div>
                <span class="section-tag" style="margin-bottom: 1.25rem; background: rgba(255, 122, 0, 0.1); border-color: rgba(255, 122, 0, 0.25); color: var(--color-accent-orange);"><i class="fa-solid fa-triangle-exclamation"></i> ERROR 404</span>
            </div>

            <!-- TITLE & SUBTITLE -->
            <h2 style="font-size: 2.1rem; margin-bottom: 1rem; color: var(--color-text-white); font-family: var(--font-heading);">Expedition Lost in Transmissions</h2>
            <p style="color: var(--color-text-muted); font-size: 0.95rem; line-height: 1.65; margin-bottom: 2.25rem;">We can't seem to find the route you're looking for. The coordinates may be broken, or the outpost has been moved. Let's get you back to base camp.</p>

            <!-- ACTION BUTTONS ROW -->
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="index.html" class="btn btn-primary" style="padding: 0.85rem 1.6rem;"><i class="fa-solid fa-house"></i> Base Camp (Home)</a>
                <button onclick="window.history.back()" class="btn btn-secondary" style="padding: 0.85rem 1.6rem; cursor: pointer;"><i class="fa-solid fa-arrow-left"></i> Turn Back</button>
            </div>

        </div>
    </div>

    <script src="js/main.js"></script>
    <script>

    </script>
</body>
</html>
